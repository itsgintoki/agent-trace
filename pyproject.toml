[project]
name = "agent-trace"
version = "0.1.0"
description = "AI-driven evaluation and testing harness for LLM tool-calling agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0",
  "openai>=1.0",
  "pydantic>=2.0",
  "rich>=13.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
agent-trace = "agent_trace.cli.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace"]
